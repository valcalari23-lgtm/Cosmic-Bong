<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmic Boing</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="viewport">
    <!-- Fixed 1920 x 1080 stage. src/stage.js scales it to fit the window. -->
    <div id="stage">
      <!-- Gameplay and space background are drawn here. All text lives in HTML. -->
      <canvas id="game" width="1920" height="1080" aria-hidden="true"></canvas>

      <!-- Title screen. Reference: docs/reference/01-title.png -->
      <section id="screen-title" class="screen" data-screen="title" aria-labelledby="title-heading">
        <img class="deco deco-meteorite" src="assets/sprites/meteorite.svg" alt="">
        <img class="deco deco-tank" src="assets/sprites/trap-tank.svg" alt="">
        <h1 id="title-heading" class="logo">
          <img src="assets/ui/logo.png" alt="Cosmic Boing" width="922" height="385">
        </h1>
        <button id="btn-start" class="press" type="button">
          <span data-i18n="common.press"></span>
          <img src="assets/ui/icon-tap.png" alt="" width="114" height="114">
          <span data-i18n="title.toStart"></span>
        </button>
        <!-- Extra game modes (stages 10-11, not in the original): meteor shower and space run. -->
        <div class="mode-row" role="group" data-i18n-aria="title.extraMode">
          <button id="btn-survival" class="press press-mode" type="button">
            <img src="assets/sprites/meteorite.svg" alt="" width="56" height="56">
            <span data-i18n="title.survival"></span>
          </button>
          <button id="btn-run" class="press press-mode" type="button">
            <img src="assets/sprites/hero-back.png" alt="" width="56" height="56">
            <span data-i18n="title.run"></span>
          </button>
        </div>
        <img class="deco deco-hero" src="assets/sprites/hero-title.png" alt="">
      </section>

      <!-- Instructions. Reference: docs/reference/02-instructions.png
           Each row is also one sentence for screen readers; the visuals are decorative. -->
      <section id="screen-instructions" class="screen" data-screen="instructions" aria-labelledby="instructions-heading" hidden>
        <img class="deco deco-panel-meteorite-top" src="assets/sprites/meteorite.svg" alt="">
        <img class="deco deco-panel-meteorite-right" src="assets/sprites/meteorite.svg" alt="">
        <div class="panel panel-instructions">
          <h2 id="instructions-heading" class="screen-title" data-i18n="instructions.title"></h2>
          <!-- One list per mode (#stage.mode-* shows the right one). Each row: picture, then the rule in words. -->
          <ul class="rules mission-only">
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite" src="assets/sprites/meteorite.svg" alt=""><img class="sight" src="assets/ui/crosshair.png" alt=""></span>
                <span class="arrow"></span>
                <img class="boom" src="assets/sprites/explosion.png" alt="">
                <span class="arrow"></span>
                <span class="result good">+50</span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowMeteorite"></span>
            </li>
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite sprite-tank" src="assets/sprites/trap-tank.svg" alt=""><img class="sight" src="assets/ui/crosshair.png" alt=""></span>
                <span class="arrow"></span>
                <img class="boom" src="assets/sprites/explosion.png" alt="">
                <span class="arrow"></span>
                <span class="result bad">&minus;50</span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowTrap"></span>
            </li>
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite" src="assets/sprites/powerup-star.svg" alt=""><img class="sight sight-star" src="assets/ui/crosshair.png" alt=""></span>
                <span class="arrow"></span>
                <img class="boom" src="assets/sprites/explosion.png" alt="">
                <span class="arrow"></span>
                <span class="result good">+<img class="clock" src="assets/ui/icon-time.png" alt=""></span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowStar"></span>
            </li>
          </ul>
          <ul class="rules survival-only">
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite" src="assets/sprites/meteorite.svg" alt=""><img class="sight" src="assets/ui/crosshair.png" alt=""></span>
                <span class="arrow"></span>
                <img class="boom" src="assets/sprites/explosion.png" alt="">
                <span class="arrow"></span>
                <span class="result good">+50</span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowMeteorite"></span>
            </li>
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite sprite-tank" src="assets/sprites/trap-tank.svg" alt=""><img class="sight" src="assets/ui/crosshair.png" alt=""></span>
                <span class="arrow"></span>
                <img class="boom" src="assets/sprites/explosion.png" alt="">
                <span class="arrow"></span>
                <span class="result bad">&minus;50</span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowTrap"></span>
            </li>
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite" src="assets/sprites/powerup-star.svg" alt=""><img class="sight sight-star" src="assets/ui/crosshair.png" alt=""></span>
                <span class="arrow"></span>
                <img class="boom" src="assets/sprites/explosion.png" alt="">
                <span class="arrow"></span>
                <span class="result good">+1 <span class="heart">&hearts;</span></span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowStarSurvival"></span>
            </li>
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite" src="assets/sprites/meteorite.svg" alt=""></span>
                <span class="arrow"></span>
                <img class="hero-small" src="assets/sprites/hero-back.png" alt="">
                <span class="arrow"></span>
                <span class="result bad">&minus;1 <span class="heart">&hearts;</span></span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowGround"></span>
            </li>
          </ul>
          <ul class="rules run-only">
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite" src="assets/sprites/meteorite.svg" alt=""></span>
                <span class="arrow"></span>
                <img class="hero-small" src="assets/sprites/hero-back.png" alt="">
                <span class="arrow"></span>
                <span class="result bad">&minus;1 <span class="heart">&hearts;</span></span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowRunMeteorite"></span>
            </li>
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite sprite-tank" src="assets/sprites/trap-tank.svg" alt=""></span>
                <span class="arrow"></span>
                <img class="hero-small" src="assets/sprites/hero-back.png" alt="">
                <span class="arrow"></span>
                <span class="result good">+100</span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowRunTank"></span>
            </li>
            <li class="rule">
              <span class="rule-visual" aria-hidden="true">
                <span class="target"><img class="sprite" src="assets/sprites/powerup-star.svg" alt=""></span>
                <span class="arrow"></span>
                <img class="hero-small" src="assets/sprites/hero-back.png" alt="">
                <span class="arrow"></span>
                <span class="result good">+1 <span class="heart">&hearts;</span></span>
              </span>
              <span class="rule-text" data-i18n="instructions.rowRunStar"></span>
            </li>
          </ul>
          <p class="body-text mission-only" data-i18n="instructions.goal"></p>
          <p class="body-text survival-only" data-i18n="instructions.goalSurvival"></p>
          <p class="body-text run-only" data-i18n="instructions.goalRun"></p>
          <button id="btn-instructions-next" class="press press-small" type="button">
            <span data-i18n="common.press"></span>
            <img src="assets/ui/icon-tap.png" alt="" width="114" height="114">
            <span data-i18n="instructions.next"></span>
          </button>
        </div>
      </section>

      <!-- Controls. New for the desktop version (the original explained the phone, see
           docs/reference/03-controls-mobile-original.png). The illustrations are Valeria's
           (2026-11-20); the dashed slot only shows if an image is missing. -->
      <section id="screen-controls" class="screen" data-screen="controls" aria-labelledby="controls-heading" hidden>
        <img class="deco deco-panel-meteorite-right" src="assets/sprites/meteorite.svg" alt="">
        <div class="panel panel-controls">
          <h2 id="controls-heading" class="screen-title" data-i18n="controls.title"></h2>
          <div class="controls-columns">
            <!-- Each control is a small table: device on the left, what to do on the right.
                 The phone row only shows on touch devices (html.is-touch, set by src/main.js). -->
            <section class="control" aria-labelledby="control-aim">
              <div class="asset-slot slot-control"><span>assets/ui/controls-aim.png</span><img src="assets/ui/controls-aim.png" alt=""></div>
              <h3 id="control-aim" class="control-title"><span class="run-hide" data-i18n="controls.aim"></span><span class="run-only" data-i18n="controls.move"></span></h3>
              <dl class="control-list">
                <div class="control-row"><dt data-i18n="controls.mouse"></dt><dd><span class="run-hide" data-i18n="controls.mouseAim"></span><span class="run-only" data-i18n="controls.mouseMove"></span></dd></div>
                <div class="control-row"><dt data-i18n="controls.keyboard"></dt>
                  <dd class="run-hide">
                    <span class="keys" aria-hidden="true"><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd></span>
                    <span class="or" aria-hidden="true" data-i18n="controls.or"></span>
                    <span class="keys" aria-hidden="true"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
                    <span class="sr-only" data-i18n="controls.keysAim"></span>
                  </dd>
                  <dd class="run-only">
                    <span class="keys" aria-hidden="true"><kbd>&larr;</kbd><kbd>&rarr;</kbd></span>
                    <span class="or" aria-hidden="true" data-i18n="controls.or"></span>
                    <span class="keys" aria-hidden="true"><kbd>A</kbd><kbd>D</kbd></span>
                    <span class="sr-only" data-i18n="controls.keysMove"></span>
                  </dd></div>
                <div class="control-row phone-only"><dt data-i18n="controls.phone"></dt><dd data-i18n="controls.phoneAim"></dd></div>
              </dl>
            </section>
            <section class="control run-hide" aria-labelledby="control-shoot">
              <div class="asset-slot slot-control"><span>assets/ui/controls-shoot.png</span><img src="assets/ui/controls-shoot.png" alt=""></div>
              <h3 id="control-shoot" class="control-title" data-i18n="controls.shoot"></h3>
              <dl class="control-list">
                <div class="control-row"><dt data-i18n="controls.mouse"></dt><dd data-i18n="controls.mouseShoot"></dd></div>
                <div class="control-row"><dt data-i18n="controls.keyboard"></dt>
                  <dd>
                    <span class="keys" aria-hidden="true"><kbd data-i18n="controls.keySpace"></kbd></span>
                    <span class="or" aria-hidden="true" data-i18n="controls.or"></span>
                    <span class="keys" aria-hidden="true"><kbd>Enter</kbd></span>
                    <span class="sr-only" data-i18n="controls.keysShoot"></span>
                  </dd></div>
                <div class="control-row phone-only"><dt data-i18n="controls.phone"></dt><dd data-i18n="controls.phoneShoot"></dd></div>
              </dl>
            </section>
          </div>
          <!-- Shortcuts, one chip each. -->
          <ul class="shortcuts" data-i18n-aria="controls.shortcuts">
            <li><span class="keys" aria-hidden="true"><kbd>P</kbd><kbd>Esc</kbd></span><span data-i18n="controls.pause"></span></li>
            <li><span class="keys" aria-hidden="true"><kbd>L</kbd></span><span data-i18n="controls.language"></span></li>
            <li><span class="keys" aria-hidden="true"><kbd>M</kbd></span><span data-i18n="controls.sound"></span></li>
          </ul>
          <button id="btn-controls-start" class="press press-small" type="button">
            <span data-i18n="common.press"></span>
            <img src="assets/ui/icon-tap.png" alt="" width="114" height="114">
            <span data-i18n="title.toStart"></span>
          </button>
        </div>
      </section>

      <!-- Game screen. The action is on the canvas; this layer takes focus and,
           from stage 2 on, holds the HUD. Reference: docs/reference/00-gameplay-mockup.png -->
      <section id="screen-game" class="screen screen-game" data-screen="game" tabindex="-1"
               data-i18n-aria="game.areaLabel" hidden>
        <p class="sr-only" data-i18n="game.help"></p>
        <!-- HUD. Reference: docs/reference/00-gameplay-mockup.png. Numbers are filled by src/hud.js. -->
        <div class="hud">
          <div id="hud-bar" class="hud-bar" role="progressbar" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"
               data-i18n-aria="hud.barLabel">
            <div id="hud-bar-fill" class="hud-bar-fill"></div>
          </div>
          <p class="hud-score"><span id="hud-score">0</span> <span data-i18n="hud.points"></span></p>
          <p class="hud-level"><span class="mission-only" data-i18n="hud.level"></span><span class="survival-only" data-i18n="hud.wave"></span><span class="run-only" data-i18n="hud.tanks"></span> <span id="hud-level">01</span></p>
          <!-- Boss lives (level 4 only): ten pips under the level label. -->
          <div id="hud-boss" class="hud-boss" role="img" hidden></div>
          <!-- Lives (meteor shower mode only): hearts where the clock normally sits. -->
          <div id="hud-lives" class="hud-lives" role="img" hidden></div>
          <!-- Level timer. The original mock-up shows no clock; placement is provisional (question 5). -->
          <p id="hud-time-box" class="hud-time" role="timer" data-i18n-aria="hud.timeLabel">
            <img src="assets/ui/icon-time.png" alt="" width="87" height="87">
            <span id="hud-time">1:00</span>
          </p>
        </div>
        <!-- Floating "+50" / "-50" labels land here. -->
        <div id="popups" class="popups"></div>
        <!-- Level change banner (provisional transition, question 13). Announced via #live. -->
        <p id="level-banner" class="level-banner" aria-hidden="true" hidden></p>
        <!-- Pause overlay (P or Esc). Not in the original: added for accessibility. -->
        <div id="pause-overlay" class="pause" role="dialog" aria-modal="true" aria-labelledby="pause-heading" hidden>
          <div class="pause-box">
            <h2 id="pause-heading" class="screen-title" data-i18n="pause.title"></h2>
            <p class="body-text" data-i18n="pause.hint"></p>
            <button id="btn-resume" class="press" type="button"><span data-i18n="pause.resume"></span></button>
            <button id="btn-exit" class="press press-quiet" type="button"><span data-i18n="pause.exit"></span></button>
          </div>
        </div>
      </section>

      <!-- Game Over. Reference: docs/reference/04-game-over.png -->
      <section id="screen-gameover" class="screen screen-gameover" data-screen="gameover" aria-labelledby="gameover-heading" hidden>
        <img class="glass" src="assets/backgrounds/game-over-glass-overlay.png" alt="">
        <div class="side-bar side-bar-left" aria-hidden="true"></div>
        <div class="side-bar side-bar-right" aria-hidden="true"></div>
        <h2 id="gameover-heading" class="gameover-title" data-i18n="gameOver.title"></h2>
        <!-- Empty tank meter, built with CSS (Figma group 38:2593). Decorative. -->
        <div class="meter" aria-hidden="true">
          <span class="meter-sign">&minus;</span>
          <span class="meter-cells"><i></i><i></i><i></i><i></i></span>
          <span class="meter-sign">+</span>
        </div>
        <!-- Meteor shower only: score and best score (src/game.js fills it). -->
        <p id="gameover-score" class="gameover-score" hidden></p>
        <p class="gameover-question" data-i18n="gameOver.restartQuestion"></p>
        <button id="btn-restart" class="press press-ink" type="button">
          <span data-i18n="common.press"></span>
          <img src="assets/ui/icon-tap.png" alt="" width="114" height="114">
          <span data-i18n="gameOver.toRestart"></span>
        </button>
        <button id="btn-home-gameover" class="press press-ink press-quiet gameover-home" type="button"><span data-i18n="common.home"></span></button>
      </section>

      <!-- Win 1: rocket heading to Earth. Reference: docs/reference/05-win-heading-to-earth.png
           The rocket, Earth and sun flare are not exported yet (docs/03-assets.md, Pendientes):
           each box shows the expected file name until the file exists, then the image covers it. -->
      <section id="screen-win1" class="screen screen-win1" data-screen="win1" tabindex="-1" aria-labelledby="win1-heading" hidden>
        <!-- Full-screen artwork (src set by src/main.js once loaded). The dashed slots below only show if it is missing. -->
        <img class="win1-bg" alt="" hidden>
        <div class="asset-slot slot-earth"><span>assets/backgrounds/win-earth.png</span><img src="assets/backgrounds/win-earth.png" alt=""></div>
        <div class="asset-slot slot-flare"><span>assets/ui/sun-flare.png</span><img src="assets/ui/sun-flare.png" alt=""></div>
        <div class="asset-slot slot-rocket"><span>assets/sprites/rocket.png</span><img src="assets/sprites/rocket.png" alt=""></div>
        <h2 id="win1-heading" class="win1-heading">
          <span class="win1-line1" data-i18n="win.headingLine1"></span>
          <span class="win1-line2" data-i18n="win.headingLine2"></span>
        </h2>
      </section>

      <!-- Win 2: home. Reference: docs/reference/06-win-home.png -->
      <section id="screen-win2" class="screen screen-win2" data-screen="win2" aria-labelledby="win2-heading" hidden>
        <img class="win2-bg" src="assets/backgrounds/home.png" alt="">
        <!-- Stacked so the title can take one or two lines in either language without overlapping. -->
        <div class="win2-stack">
          <h2 id="win2-heading" class="win2-heading"><span data-i18n="win.home"></span></h2>
          <!-- Light plate: the dark text would fall below 4.5:1 where it crosses the green hills. -->
          <div class="win2-actions">
            <p class="win2-question" data-i18n="win.playAgain"></p>
            <button id="btn-play-again" class="press press-ink" type="button">
              <span data-i18n="common.press"></span>
              <img src="assets/ui/icon-tap.png" alt="" width="114" height="114">
              <span data-i18n="win.toRestart"></span>
            </button>
            <button id="btn-home-win" class="press press-ink press-quiet" type="button"><span data-i18n="common.home"></span></button>
          </div>
        </div>
        <img class="win2-hero" src="assets/sprites/hero-home.png" alt="">
      </section>

      <!-- Sound switch (src/audio.js sets its label) and language switch.
           Neither is in the original design: added for the desktop version. -->
      <button id="btn-sound" class="corner-btn sound" type="button">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.6 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path class="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-lang" class="corner-btn lang" type="button" aria-describedby="lang-hint">
        <span id="lang-label"></span>
      </button>
      <span id="lang-hint" class="sr-only" data-i18n="common.langHint"></span>

      <pre id="debug" hidden></pre>
    </div>

    <!-- Screen reader announcements (level changes, game over, score milestones). -->
    <div id="live" class="sr-only" aria-live="polite"></div>
  </main>

  <noscript>Cosmic Boing needs JavaScript. / Cosmic Boing necesita JavaScript.</noscript>

  <!-- Classic scripts, loaded in order. No ES modules: the game must open from file://. -->
  <script src="src/config.js"></script>
  <script src="src/strings.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/stage.js"></script>
  <script src="src/screens.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
